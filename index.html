<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>the surround · interiors · Toronto</title>
<meta name="description" content="An interior design studio for Toronto condo owners. Sophisticated, playful — and refusing to be beige.">
<link rel="icon" href="assets/monogram-O.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:ital,wght@0,200;0,300;0,400;0,500;1,200;1,300;1,400&display=swap" rel="stylesheet">

<style>
:root {
  --ink:#181420; --bone:#F0EAE0; --lilac:#9B7FA6;
  --ink-900:#0E0B16; --ink-800:#181420; --ink-700:#24202E;
  --ink-600:#3A3447; --ink-500:#5A5266;
  --bone-50:#FBF7F0; --bone-200:#F0EAE0; --bone-300:#E7DFD0;
  --lilac-100:#E4D9E8; --lilac-200:#CDBBD4; --lilac-300:#B49CBE;
  --lilac-400:#9B7FA6; --lilac-500:#806588; --lilac-700:#46384D;
  --dusk:#C49A7A; --moss:#6B7A5C;
  --fg-muted:#5A5266; --line:rgba(24,20,32,.12);
  --font-sans:'Sora','Helvetica Neue',system-ui,-apple-system,sans-serif;
  --font-mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --ease-out:cubic-bezier(0.22,1,0.36,1);
  --r-3:14px; --r-4:22px; --r-pill:999px;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0E0B16;}
body{color:#FBF7F0;font-family:var(--font-sans);cursor:none;-webkit-font-smoothing:antialiased;}

/* cursor */
#cursor{
  position:fixed;z-index:9999;pointer-events:none;
  width:24px;height:24px;border:1.5px solid rgba(251,247,240,.5);
  border-radius:50%;transform:translate(-50%,-50%);
  transition:transform 80ms;mix-blend-mode:difference;
}
#cursor.pressed{transform:translate(-50%,-50%) scale(0.65);}

/* stage grid */
.stage{position:fixed;inset:0;display:grid;grid-template-rows:64px 1fr 80px;overflow:hidden;}

/* ── Top bar ── */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 32px;z-index:30;position:relative;
}
.brand{display:flex;align-items:baseline;gap:6px;
  font-weight:500;font-size:18px;letter-spacing:-0.01em;
  color:var(--bone-50);user-select:none;cursor:pointer;}
.brand .the{font-weight:200;font-size:12px;opacity:.6;transform:translateY(-5px);letter-spacing:.04em;}
.brand .sep{opacity:.25;margin:0 10px;font-weight:200;}
.brand .sub{opacity:.45;font-size:12px;font-weight:300;}
.topbar-nav{display:flex;gap:28px;font-size:13px;}
.topbar-nav a{color:var(--bone-50);border:0;opacity:.55;cursor:pointer;
  transition:opacity 200ms;letter-spacing:.01em;}
.topbar-nav a:hover{opacity:1;}

/* ── Scene area ── */
.scene-area{position:relative;overflow:hidden;margin:0 32px;border-radius:22px;isolation:isolate;}
.scene{position:absolute;inset:0;opacity:0;pointer-events:none;will-change:opacity,transform,filter;}

/* ── Room ── */
.room{
  position:absolute;inset:0;display:grid;grid-template-rows:62% 38%;
  background:var(--wall-color,var(--ink-700));overflow:hidden;
}
.room .wall{
  background:var(--wall-color);position:relative;overflow:hidden;
  background-image:
    radial-gradient(ellipse at 80% 22%,rgba(255,255,255,.09) 0%,transparent 48%),
    radial-gradient(ellipse at 10% 85%,rgba(0,0,0,.18) 0%,transparent 38%),
    linear-gradient(180deg,rgba(0,0,0,.07) 0%,transparent 22%);
}
.room .floor{
  background:var(--floor-color,#0E0B16);position:relative;
  background-image:
    linear-gradient(180deg,rgba(0,0,0,.30) 0%,transparent 28%),
    linear-gradient(180deg,transparent 52%,rgba(0,0,0,.44) 100%),
    linear-gradient(180deg,rgba(255,255,255,.032) 0%,transparent 18%),
    repeating-linear-gradient(90deg,transparent 0,transparent 66px,rgba(255,255,255,.016) 66px,rgba(255,255,255,.016) 67px);
}
/* horizon glow */
.room::before{
  content:'';position:absolute;left:0;right:0;top:62%;height:1px;
  background:linear-gradient(90deg,transparent,var(--accent-color,var(--lilac-300)) 50%,transparent);
  opacity:.4;z-index:5;
}

/* ── O-window ── */
.O-window{
  position:absolute;left:58%;top:14%;width:42%;aspect-ratio:1;
  border:2px solid var(--accent-color,rgba(251,247,240,.25));border-radius:50%;
  background:
    radial-gradient(circle at 30% 30%,rgba(255,255,255,.18),transparent 60%),
    linear-gradient(180deg,var(--sky-top,#2a2335) 0%,var(--sky-bot,#181420) 70%,transparent 100%);
  z-index:2;
}
.O-window::after{
  content:'';position:absolute;left:12%;right:12%;bottom:18%;height:28%;
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.55)),
    repeating-linear-gradient(90deg,transparent 0 16px,rgba(0,0,0,.15) 16px 17px);
  opacity:.6;
}
/* soft light bleed from window onto wall */
.O-window-glow{
  position:absolute;left:44%;top:-14%;width:66%;aspect-ratio:1;
  border-radius:50%;pointer-events:none;z-index:1;
  background:radial-gradient(circle,rgba(196,154,122,.20) 0%,rgba(155,127,166,.09) 42%,transparent 70%);
}
/* dim veil — fades out when scene arrives */
.room-veil{
  position:absolute;inset:0;background:#080610;
  opacity:1;z-index:9;pointer-events:none;will-change:opacity;
}

/* ── Furniture ── */
.furn{position:absolute;z-index:4;}
.furn svg{display:block;}

/* ── Hotspots ── */
.hotspot{
  position:absolute;z-index:6;width:30px;height:30px;border-radius:50%;
  background:transparent;border:none;cursor:pointer;padding:0;
  display:flex;align-items:center;justify-content:center;
  transform:translate(-50%,-50%);
  transition:transform 200ms var(--ease-out);
}
.hotspot:hover{transform:translate(-50%,-50%) scale(1.2);}
.hotspot .pulse{
  position:absolute;inset:0;border-radius:50%;background:rgba(251,247,240,.5);
  opacity:.3;animation:pulse 2.4s ease-out infinite;
}
@keyframes pulse{
  0%{transform:scale(.6);opacity:.6;}
  60%{transform:scale(1.7);opacity:0;}
  100%{transform:scale(1.7);opacity:0;}
}
.hotspot .dot{
  width:11px;height:11px;border-radius:50%;background:var(--bone-50);
  box-shadow:0 0 0 4px rgba(240,234,224,.15);z-index:2;
}
.hotspot.dark .dot{background:var(--ink);box-shadow:0 0 0 4px rgba(24,20,32,.18);}
.hotspot.dark .pulse{background:var(--ink);}

/* ── Scene label ── */
.scene-label{position:absolute;left:38px;top:36px;z-index:8;color:var(--bone-50);}
.scene-label .eyebrow{
  font-size:10px;letter-spacing:.22em;text-transform:uppercase;
  opacity:.6;margin-bottom:14px;color:var(--accent-color,var(--bone-50));
}
.scene-label h1{
  font-weight:200;font-size:clamp(38px,4.8vw,62px);
  letter-spacing:-0.03em;line-height:1.0;color:var(--bone-50);max-width:13ch;margin:0;
}
.scene-label h1 em{
  font-style:italic;font-weight:300;
  color:var(--accent-color,var(--lilac-300));letter-spacing:-0.025em;
}
.scene-label p{
  margin-top:22px;max-width:30ch;font-size:14px;line-height:1.58;
  color:rgba(240,234,224,.75);
}

/* ── Bottom bar ── */
.bottombar{
  display:grid;grid-template-columns:1fr auto 1fr;
  align-items:center;gap:24px;padding:0 32px 18px;z-index:30;
}
.scene-now{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--bone-50);opacity:.6;font-family:var(--font-mono);}
.scene-now em{font-style:normal;color:var(--lilac-300);margin-right:12px;}
.dots{display:flex;gap:8px;justify-content:center;}
.dot-btn{
  width:8px;height:8px;border-radius:50%;background:transparent;
  border:1px solid rgba(251,247,240,.4);opacity:.5;cursor:pointer;padding:0;
  transition:all 200ms var(--ease-out);
}
.dot-btn.active{background:var(--bone-50);opacity:1;transform:scale(1.4);}
.dot-btn:hover{opacity:.85;}
.nav-btn{display:flex;gap:10px;justify-content:flex-end;}
.nav-btn button{
  background:transparent;border:1px solid rgba(240,234,224,.25);color:var(--bone-50);
  padding:7px 18px;border-radius:var(--r-pill);cursor:pointer;
  font-family:var(--font-sans);font-size:12.5px;letter-spacing:.05em;
  transition:all 180ms var(--ease-out);
}
.nav-btn button:hover{background:var(--bone-50);color:var(--ink);border-color:var(--bone-50);}
.nav-btn button:disabled{opacity:.2;cursor:not-allowed;}
.nav-btn button.primary{background:var(--bone-50);color:var(--ink);border-color:var(--bone-50);}

/* ── Moodboard rail ── */
.moodboard-rail{
  position:absolute;left:38px;bottom:32px;z-index:8;
  display:flex;align-items:center;gap:16px;color:var(--bone-50);
}
.moodboard-rail .count{font-family:var(--font-mono);font-size:11px;letter-spacing:.16em;opacity:.55;}
.moodboard-rail .hint{font-size:12px;opacity:.6;letter-spacing:.03em;}

/* ── Opening scene ── */
@keyframes openingBg{
  0%,100%{background:#0E0B16;}
  25%    {background:#1a1228;}
  50%    {background:#1e1520;}
  75%    {background:#181420;}
}
.scene.opening{animation:openingBg 20s ease-in-out infinite;}

.opening-wrap{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
}
.opening-mark{text-align:center;z-index:2;user-select:none;}

/* Big O — fades in on load, then breathes with glow */
@keyframes oAppear{
  from{opacity:0;transform:scale(0.9);}
  to  {opacity:1;transform:scale(1);}
}
@keyframes breathe{
  0%,100%{
    transform:scale(1);
    border-color:rgba(240,234,224,.18);
    box-shadow:0 0 0 0 rgba(155,127,166,0);
  }
  50%{
    transform:scale(1.09);
    border-color:rgba(155,127,166,.55);
    box-shadow:0 0 70px 24px rgba(155,127,166,.13),0 0 140px 60px rgba(155,127,166,.05);
  }
}

.O-big{
  width:260px;height:260px;
  border:2px solid rgba(240,234,224,.18);border-radius:50%;
  margin:0 auto 36px;
  position:relative;
  background:radial-gradient(circle at 35% 35%,rgba(155,127,166,.06),transparent 65%);
  /* appear first, breathe after */
  animation:oAppear 1.4s ease-out 0.15s both, breathe 5.5s ease-in-out 1.6s infinite;
}

/* Staggered text fade-ins */
@keyframes fadeSlideUp{
  from{opacity:0;transform:translateY(10px);}
  to  {opacity:1;transform:translateY(0);}
}
.opening-wm{
  font-weight:500;font-size:46px;letter-spacing:-0.03em;color:var(--bone-50);
  display:flex;align-items:baseline;justify-content:center;gap:9px;
  opacity:0;animation:fadeSlideUp 1s ease-out 0.7s both;
}
.opening-wm .the{font-size:19px;font-weight:200;opacity:.6;}
.opening-sub{
  margin-top:18px;font-size:12.5px;color:rgba(240,234,224,.5);
  letter-spacing:.2em;text-transform:uppercase;
  opacity:0;animation:fadeSlideUp 0.9s ease-out 1.4s both;
}
.opening-hint{
  margin-top:56px;font-size:11px;font-family:var(--font-mono);
  letter-spacing:.2em;color:rgba(155,127,166,.65);text-transform:uppercase;
  opacity:0;animation:fadeSlideUp 0.9s ease-out 2.3s both, hintPulse 3.5s ease-in-out 3.4s infinite;
}
@keyframes hintPulse{0%,100%{opacity:.55;}50%{opacity:1;}}

/* ── Flying O (iris wipe — expands to cover entire screen) ── */
.flying-o{
  position:fixed;border-radius:50%;pointer-events:none;z-index:200;
  /* Size + position set by JS before animation starts */
  border:none;
  background:radial-gradient(circle at 50% 50%,#1e1430 0%,#0D0A15 55%,#0E0B16 100%);
  opacity:0;
  transform-origin:center center;
  will-change:transform,opacity;
}

/* ── Modal overlay ── */
.modal-overlay{
  position:fixed;inset:0;z-index:50;
  background:rgba(14,11,22,.72);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  opacity:0;pointer-events:none;
}
.modal-card{
  position:absolute;left:50%;top:50%;
  width:520px;max-width:92vw;max-height:88vh;
  background:var(--bone-200);border-radius:20px;
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 40px 80px -20px rgba(0,0,0,.5);
  transform:translate(-50%,-50%);
  opacity:0;
}
.modal-close{
  position:absolute;top:14px;right:14px;z-index:10;
  width:30px;height:30px;border-radius:50%;
  border:1px solid rgba(24,20,32,.15);background:rgba(240,234,224,.8);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:var(--ink);transition:background 150ms;
}
.modal-close:hover{background:var(--bone-50);}
.modal-preview{
  height:260px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
}
.modal-preview svg{max-width:55%;max-height:55%;}
.modal-body{padding:24px 28px 28px;color:var(--ink);overflow-y:auto;}
.modal-body .kicker{
  font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--fg-muted);margin-bottom:8px;
}
.modal-body h3{font-weight:300;font-size:27px;letter-spacing:-0.02em;margin:0 0 5px;color:var(--ink);}
.modal-body .design{font-style:italic;font-weight:300;font-size:15px;color:var(--lilac-500);margin-bottom:18px;}
.modal-body .blurb{font-size:13.5px;line-height:1.6;color:var(--ink-700);margin-bottom:20px;}
.modal-body .meta-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:14px;
  padding:16px 0;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  margin-bottom:18px;
}
.modal-body .meta-grid .k{
  font-family:var(--font-mono);font-size:9.5px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--fg-muted);margin-bottom:3px;
}
.modal-body .meta-grid .v{font-size:13.5px;font-weight:500;color:var(--ink);}
.modal-actions{display:flex;flex-direction:column;gap:9px;}
.btn-pri,.btn-sec{
  font-family:var(--font-sans);font-size:13.5px;font-weight:500;
  padding:12px 20px;border-radius:var(--r-pill);border:0;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:space-between;
  transition:all 170ms var(--ease-out);
}
.btn-pri{background:var(--ink);color:var(--bone-50);}
.btn-pri:hover{background:var(--lilac-500);}
.btn-sec{background:transparent;color:var(--ink);border:1px solid var(--ink);}
.btn-sec:hover{background:var(--ink);color:var(--bone-50);}
.arr{transition:transform 180ms var(--ease-out);}
.btn-pri:hover .arr,.btn-sec:hover .arr{transform:translateX(5px);}

/* ── Begin scene ── */
.begin-content{
  position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;gap:64px;
  padding:56px;color:var(--bone-50);z-index:5;
}
.begin-content h1{
  font-weight:200;font-size:clamp(44px,5.5vw,80px);
  letter-spacing:-0.03em;line-height:1.0;color:var(--bone-50);margin:0;
}
.begin-content h1 em{font-style:italic;font-weight:300;color:rgba(240,234,224,.65);}
.begin-lede{margin-top:22px;font-size:14.5px;line-height:1.65;max-width:36ch;color:rgba(240,234,224,.82);}
.begin-form{display:flex;flex-direction:column;gap:15px;align-self:center;}
.begin-form>div{display:flex;flex-direction:column;gap:5px;}
.begin-form label{
  font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;
  color:rgba(240,234,224,.55);
}
.begin-form input,.begin-form textarea,.begin-form select{
  font-family:var(--font-sans);font-size:14.5px;color:var(--bone-50);
  background:transparent;border:0;border-bottom:1px solid rgba(240,234,224,.3);
  padding:9px 0;outline:none;width:100%;transition:border-color 150ms;
}
.begin-form input:focus,.begin-form textarea:focus,.begin-form select:focus{
  border-color:rgba(240,234,224,.75);
}
.begin-form input::placeholder,.begin-form textarea::placeholder{color:rgba(240,234,224,.35);}
.begin-form select{appearance:none;cursor:pointer;}
.begin-form select option{background:#3a2e45;color:#fff;}
.submit-btn{
  margin-top:6px;background:var(--bone-200);color:var(--lilac-700);
  border-radius:var(--r-pill);padding:13px 22px;font-weight:500;
  cursor:pointer;border:0;display:inline-flex;justify-content:space-between;
  align-items:center;font-family:var(--font-sans);font-size:14px;
  transition:all 180ms var(--ease-out);
}
.submit-btn:hover{background:var(--bone-50);}

/* ── Vignette ── */
.vignette{
  position:fixed;inset:0;z-index:20;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(14,11,22,.55) 100%);
}

/* responsive */
@media(max-width:880px){
  .scene-label{left:22px;top:22px;right:22px;}
  .scene-label h1{font-size:clamp(30px,9vw,50px);}
  .begin-content{grid-template-columns:1fr;padding:32px;gap:32px;}
  .O-window{left:35%;top:28%;width:60%;}
  .scene-area{margin:0 14px;}
  .topbar,.bottombar{padding:0 18px;}
  .topbar{padding-bottom:0;padding-top:0;}
  .bottombar{padding-bottom:14px;}
}
@media(max-width:580px){
  .topbar-nav{display:none;}
  .brand .sep,.brand .sub{display:none;}
  .O-big{width:190px;height:190px;}
  .opening-wm{font-size:34px;}
}
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>

<div id="cursor"></div>
<div class="vignette"></div>
<div id="app"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ── Furniture SVG components ─────────────────────────────────────

const Sofa = ({ color='#C49A7A', leg='#181420' }) => (
  <svg viewBox="0 0 240 110" width="100%" height="100%">
    <rect x="14" y="14" width="212" height="50" rx="10" fill={color}/>
    <rect x="20" y="48" width="100" height="38" rx="8" fill={color} opacity=".85"/>
    <rect x="120" y="48" width="100" height="38" rx="8" fill={color} opacity=".85"/>
    <rect x="0" y="36" width="22" height="56" rx="8" fill={color} opacity=".9"/>
    <rect x="218" y="36" width="22" height="56" rx="8" fill={color} opacity=".9"/>
    <rect x="14" y="88" width="6" height="14" fill={leg}/>
    <rect x="220" y="88" width="6" height="14" fill={leg}/>
    <circle cx="44" cy="58" r="13" fill="#F0EAE0" opacity=".55"/>
  </svg>
);

const ArcLamp = ({ color='#F0EAE0', pole='#181420' }) => (
  <svg viewBox="0 0 120 220" width="100%" height="100%">
    <ellipse cx="100" cy="208" rx="18" ry="4" fill={pole}/>
    <path d="M100 208 L100 140 Q100 30 30 30" stroke={pole} strokeWidth="3" fill="none" strokeLinecap="round"/>
    <ellipse cx="30" cy="36" rx="20" ry="10" fill={color}/>
    <rect x="10" y="36" width="40" height="22" fill={color}/>
    <ellipse cx="30" cy="58" rx="20" ry="10" fill={color} opacity=".7"/>
  </svg>
);

const CoffeeTable = ({ color='#181420', top='#C49A7A' }) => (
  <svg viewBox="0 0 200 70" width="100%" height="100%">
    <ellipse cx="100" cy="20" rx="92" ry="14" fill={top}/>
    <ellipse cx="100" cy="20" rx="92" ry="14" fill="none" stroke={color} strokeWidth="1.5"/>
    <rect x="20" y="22" width="3" height="40" fill={color}/>
    <rect x="178" y="22" width="3" height="40" fill={color}/>
    <ellipse cx="100" cy="64" rx="80" ry="5" fill={color} opacity=".18"/>
  </svg>
);

const Vase = ({ color='#9B7FA6', stem='#6B7A5C' }) => (
  <svg viewBox="0 0 80 180" width="100%" height="100%">
    <path d="M40 80 Q30 50 20 28" stroke={stem} strokeWidth="1.5" fill="none" strokeLinecap="round"/>
    <path d="M40 80 Q50 45 56 18" stroke={stem} strokeWidth="1.5" fill="none" strokeLinecap="round"/>
    <path d="M40 80 Q42 60 44 38" stroke={stem} strokeWidth="1.5" fill="none" strokeLinecap="round"/>
    <ellipse cx="20" cy="26" rx="3.5" ry="6" fill={stem}/>

// ── Flying O — iris wipe: O expands to fill screen, room fades in beneath ────
// Duration breakdown:
//   0 →  100ms : O snaps visible at its starting size
//   100 → 1300ms: O expands (scale) to cover the entire viewport
//   1300 → 1700ms: O holds, covering everything (room is fading in behind it)
//   1700 → 2800ms: O fades out, revealing the room beneath
//
// setIdx(1) fires at ~750ms so the room fade-in (2200ms) begins while
// the O is still expanding — when the O lifts, the room is already there.

function FlyingO({ active, onDone }) {
  const ref = useRef(null);

  useEffect(() => {
    if (!active) return;
    const el = ref.current;
    if (!el) return;

    const vw = window.innerWidth, vh = window.innerHeight;

    // Find the O-big's actual rendered center — it sits above vh/2 because the
    // whole mark block (O + wordmark + subtitle + hint) is flex-centered as a unit.
    const oBigEl = document.querySelector('.O-big');
    let oCx = vw / 2, oCy = vh / 2;
    let oBigSize = vw <= 580 ? 190 : 260;
    if (oBigEl) {
      const r = oBigEl.getBoundingClientRect();
      oCx = r.left + r.width  / 2;
      oCy = r.top  + r.height / 2;
      oBigSize = r.width;
    }

    // Diameter must cover the whole viewport from this center point:
    // the circle needs to reach the farthest viewport corner.
    const farthest = Math.max(
      Math.hypot(oCx, oCy),
      Math.hypot(vw - oCx, oCy),
      Math.hypot(oCx, vh - oCy),
      Math.hypot(vw - oCx, vh - oCy)
    );
    const diameter = farthest * 2 * 1.06; // 6 % margin so no gap at edges

    // Position the flying O centred exactly over the O-big
    Object.assign(el.style, {
      width:  diameter + 'px',
      height: diameter + 'px',
      left:   (oCx - diameter / 2) + 'px',
      top:    (oCy - diameter / 2) + 'px',
      opacity: '0',
      transform: `scale(${oBigSize / diameter})`,
    });

    const anim = el.animate([
      // snap on at O-big size
      { transform: `scale(${oBigSize / diameter})`,       opacity: 0,    offset: 0 },
      { transform: `scale(${oBigSize / diameter})`,       opacity: 0.96, offset: 0.035 },
      // expand to fill screen
      { transform: 'scale(1)',                            opacity: 0.97, offset: 0.46 },
      // hold
      { transform: 'scale(1)',                            opacity: 0.97, offset: 0.60 },
      // fade out to reveal room
      { transform: 'scale(1)',                            opacity: 0,    offset: 1 },
    ], {
      duration: 2800,
      easing:   'cubic-bezier(0.65, 0, 0.35, 1)',
      fill:     'forwards',
    });

    anim.addEventListener('finish', onDone);
  }, [active]);

  return <div ref={ref} className="flying-o" />;
}

// ── Modal detail card — scales from hotspot position ─────────────

function Modal({ item, pos, onClose }) {
  const maskRef = useRef(null);
  const cardRef = useRef(null);
  const [content, setContent] = useState(null);
  const open = !!item;

  useEffect(() => { if (item) setContent(item); }, [item]);

  useEffect(() => {
    const mask = maskRef.current, card = cardRef.current;
    if (!mask || !card) return;
    mask.getAnimations().forEach(a => a.cancel());
    card.getAnimations().forEach(a => a.cancel());

    if (open) {
      mask.style.pointerEvents = 'auto';
      mask.animate([{ opacity:0 },{ opacity:1 }],
        { duration: 500, easing: 'ease-out', fill: 'forwards' });

      // Scale from hotspot position toward card center
      const cx = window.innerWidth / 2;
      const cy = window.innerHeight / 2;
      const dx = pos ? pos.x - cx : 0;
      const dy = pos ? pos.y - cy : 0;
      const startT = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(0.06)`;
      const endT   = `translate(-50%, -50%) scale(1)`;

      card.animate(
        [{ transform: startT, opacity: 0 }, { transform: endT, opacity: 1 }],
        { duration: 700, easing: 'cubic-bezier(0.22,1,0.36,1)', fill: 'forwards' }
      );
    } else {
      mask.style.pointerEvents = 'none';
      mask.animate([{ opacity:1 },{ opacity:0 }],
        { duration: 380, easing: 'ease-in', fill: 'forwards' });
      const a = card.animate(
        [{ transform:'translate(-50%,-50%) scale(1)', opacity:1 },
         { transform:'translate(-50%,-50%) scale(0.9)', opacity:0 }],
        { duration: 350, easing: 'ease-in', fill: 'forwards' }
      );
      a.addEventListener('finish', () => setContent(null));
    }
  }, [open]);

  if (!content) return null;
  const C = FURN[content.Comp];
  return (
    <div ref={maskRef} className="modal-overlay" onClick={onClose}>
      <div ref={cardRef} className="modal-card" onClick={e => e.stopPropagation()}>
        <button className="modal-close" onClick={onClose} aria-label="close">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" strokeWidth="2">
            <path d="M18 6 6 18M6 6l12 12"/>
          </svg>
        </button>
        <div className="modal-preview" style={{ background: previewBg(content.Comp) }}>
          {C && <C {...content.props}/>}
        </div>
        <div className="modal-body">
          <div className="kicker">{content.info.kicker}</div>
          <h3>{content.info.name}</h3>
          <div className="design">{content.info.design}</div>
          {content.info.blurb && <p className="blurb">{content.info.blurb}</p>}
          <div className="meta-grid">
            {content.info.meta.map(([k,v],i) => (
              <div key={i}><div className="k">{k}</div><div className="v">{v}</div></div>
            ))}
          </div>
          <div className="modal-actions">
            <button className="btn-pri">Save to moodboard <span className="arr">→</span></button>
            <button className="btn-sec">We'll source for you <span className="arr">→</span></button>
          </div>
        </div>
      </div>
    </div>
  );
}

          style={{ left:item.hot.x, top:item.hot.y }}
          onClick={e => {
            const r = e.currentTarget.getBoundingClientRect();
            onHotspot(item, { x: r.left + r.width/2, y: r.top + r.height/2 });
          }}
          aria-label={"open "+item.info.name}
        >
          <span className="pulse"/>
          <span className="dot"/>
        </button>
      ))}
      <div className="moodboard-rail">
        <span className="count">{scene.items.length} pieces</span>
        <span className="hint">tap a dot to see the source</span>
      </div>
    </>
  );
}

// ── Scene slot — WAAPI cross-fade + scale ─────────────────────────

function SceneSlot({ scene, isActive, isBehind, children }) {
  const ref       = useRef(null);
  const mounted   = useRef(false);

  // useLayoutEffect fires synchronously before browser paint,
  // so the element is never rendered at the wrong opacity mid-frame.
  useLayoutEffect(() => {
    const el = ref.current;
    if (!el) return;

    const targetOp    = isActive ? 1 : 0;
    const targetScale = isActive ? 1 : (isBehind ? 0.975 : 1.025);
    const targetBlur  = isActive ? 0 : 5;

    el.getAnimations().forEach(a => a.cancel());

    if (!mounted.current) {
      // Initial mount — set immediately with no animation
      mounted.current = true;
      el.style.opacity   = String(targetOp);
      el.style.transform = `scale(${targetScale})`;
      el.style.filter    = targetBlur > 0 ? `blur(${targetBlur}px)` : 'none';
      return;
    }

    const cs   = getComputedStyle(el);
    const curOp = parseFloat(cs.opacity) || 0;
    const curTr = cs.transform === 'none' ? 'scale(1)' : cs.transform;
    const curFl = cs.filter    === 'none' ? 'blur(0px)' : cs.filter;

    el.animate([
      { opacity: curOp, transform: curTr, filter: curFl },
      { opacity: targetOp, transform: `scale(${targetScale})`, filter: `blur(${targetBlur}px)` },
    ], { duration: 2200, easing: 'cubic-bezier(0.65, 0, 0.35, 1)', fill: 'forwards' });
  }, [isActive, isBehind]);

  return (
    <div
      ref={ref}
      className={"scene"+(scene.kind==='opening'?' opening':'')}
      style={{
        ...(scene.palette || {}),
        pointerEvents: isActive ? 'auto' : 'none',
        position:'absolute', inset:0,
      }}
    >
      {children}
    </div>
  );
}

// ── Stage — the whole thing ───────────────────────────────────────

function Stage() {
  const [idx, setIdx]           = useState(0);
  const [hot, setHot]           = useState(null);
  const [hotPos, setHotPos]     = useState(null);
  const [flyingO, setFlyingO]   = useState(false);
  const transitioning           = useRef(false);

  // Navigate — intercepts 0→1 to trigger the iris-wipe O transition
  const goTo = useCallback((target) => {
    if (idx === 0 && target === 1 && !transitioning.current) {
      transitioning.current = true;
      setFlyingO(true);
      // Wait for O to fully fade out before activating the room
      // (O reaches opacity 0 at 2800ms; 2650ms gives a clean handoff)
      setTimeout(() => setIdx(1), 2650);
    } else {
      setIdx(target);
    }
  }, [idx]);

  const doneFlyingO = useCallback(() => {
    setFlyingO(false);
    transitioning.current = false;
  }, []);

  // Keyboard navigation
  useEffect(() => {
    const onKey = e => {
      if (hot) { if (e.key === 'Escape') { setHot(null); setHotPos(null); } return; }
      if (e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' ') {
        e.preventDefault(); goTo(Math.min(SCENES.length-1, idx+1));
      }
      if (e.key==='ArrowLeft'||e.key==='ArrowUp') goTo(Math.max(0, idx-1));
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [hot, idx, goTo]);

  // Click anywhere on opening → advance
  useEffect(() => {
    if (idx !== 0) return;
    const onClick = e => {
      if (e.target.closest('.topbar')||e.target.closest('.bottombar')) return;
      goTo(1);
    };
    window.addEventListener('click', onClick);
    return () => window.removeEventListener('click', onClick);
  }, [idx, goTo]);

  const scene = SCENES[idx];

  return (
    <div className="stage">
      <TopBar onJump={goTo}/>
      <div className="scene-area">
        {SCENES.map((s,i) => (
          <SceneSlot key={s.id} scene={s} isActive={i===idx} isBehind={i<idx}>
            {s.kind==='opening' && <OpeningScene/>}
            {s.kind==='room'    && <RoomScene scene={s} isActive={i===idx} onHotspot={(item,pos)=>{ setHot(item); setHotPos(pos); }}/>}
            {s.kind==='begin'   && <BeginScene/>}
          </SceneSlot>
        ))}
      </div>
      <BottomBar idx={idx} total={SCENES.length} setIdx={goTo} scene={scene}/>
      <FlyingO active={flyingO} onDone={doneFlyingO}/>
      <Modal item={hot} pos={hotPos} onClose={()=>{ setHot(null); setHotPos(null); }}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<Stage/>);
</script>

<script>
// Smooth cursor
(function(){
  const c = document.getElementById('cursor');
  let mx=-100,my=-100,cx=-100,cy=-100;
  document.addEventListener('mousemove',e=>{ mx=e.clientX; my=e.clientY; });
  document.addEventListener('mousedown',()=>c.classList.add('pressed'));
  document.addEventListener('mouseup',()=>c.classList.remove('pressed'));
  document.addEventListener('mouseleave',()=>{ mx=-200; my=-200; });
  function lerp(a,b,t){ return a+(b-a)*t; }
  (function tick(){
    cx=lerp(cx,mx,.18); cy=lerp(cy,my,.18);
    c.style.left=cx+'px'; c.style.top=cy+'px';
    requestAnimationFrame(tick);
  })();
})();
</script>
