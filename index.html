<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>the surround · interiors · Toronto</title>
<meta name="description" content="An interior design studio for Toronto condo owners. Sophisticated, playful — and refusing to be beige.">
<meta property="og:title" content="the surround · interiors · Toronto">
<link rel="icon" href="assets/monogram-O.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:ital,wght@0,200;0,300;0,400;0,500;1,200;1,300;1,400&display=swap" rel="stylesheet">

<style>
:root {
  --ink: #181420; --bone: #F0EAE0; --lilac: #9B7FA6;
  --ink-900: #0E0B16; --ink-800: #181420; --ink-700: #24202E;
  --ink-600: #3A3447; --ink-500: #5A5266; --ink-400: #847B91;
  --bone-50: #FBF7F0; --bone-200: #F0EAE0; --bone-300: #E7DFD0;
  --lilac-50: #F4EFF6; --lilac-100: #E4D9E8; --lilac-200: #CDBBD4;
  --lilac-300: #B49CBE; --lilac-400: #9B7FA6; --lilac-500: #806588;
  --lilac-600: #634E6B; --lilac-700: #46384D;
  --dusk: #C49A7A; --moss: #6B7A5C;
  --fg-muted: #5A5266; --line: rgba(24,20,32,.12);
  --font-sans: 'Sora','Helvetica Neue',system-ui,-apple-system,sans-serif;
  --font-mono: ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --ease-out: cubic-bezier(0.22,1,0.36,1);
  --ease-in-out: cubic-bezier(0.65,0,0.35,1);
  --r-1:4px; --r-2:8px; --r-3:14px; --r-4:22px; --r-pill:999px;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--ink-900);}
body{color:var(--bone-50);font-family:var(--font-sans);cursor:none;-webkit-font-smoothing:antialiased;}

/* cursor */
#cursor{
  position:fixed;z-index:9999;pointer-events:none;
  width:24px;height:24px;border:1.5px solid rgba(251,247,240,.5);
  border-radius:50%;transform:translate(-50%,-50%);
  mix-blend-mode:difference;
}
#cursor.pressed{transform:translate(-50%,-50%) scale(0.7);}

/* stage */
.stage{position:fixed;inset:0;display:grid;grid-template-rows:64px 1fr 80px;overflow:hidden;}

/* top bar */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 32px;z-index:30;position:relative;
}
.brand{display:flex;align-items:baseline;gap:6px;font-weight:500;font-size:18px;
  letter-spacing:-0.01em;color:var(--bone-50);user-select:none;cursor:pointer;}
.brand .the{font-weight:200;font-size:12px;opacity:.6;transform:translateY(-5px);letter-spacing:.04em;}
.brand .sep{opacity:.3;font-size:12px;margin:0 8px;}
.brand .sub{opacity:.5;font-size:12px;font-weight:300;}
.topbar-nav{display:flex;gap:28px;font-size:13px;}
.topbar-nav a{color:var(--bone-50);border:0;opacity:.7;cursor:pointer;transition:opacity 200ms;}
.topbar-nav a:hover{opacity:1;}

/* scene area */
.scene-area{position:relative;overflow:hidden;margin:0 32px;border-radius:var(--r-4);isolation:isolate;}
.scene{position:absolute;inset:0;opacity:0;pointer-events:none;}

/* room */
.room{
  position:absolute;inset:0;display:grid;grid-template-rows:62% 38%;
  background:var(--wall-color,var(--ink-700));overflow:hidden;
}
.room .wall{background:var(--wall-color);position:relative;overflow:hidden;}
.room .floor{
  background:var(--floor-color,var(--ink-900));position:relative;
  background-image:linear-gradient(180deg,rgba(0,0,0,.18),transparent 40%),linear-gradient(180deg,transparent,rgba(0,0,0,.32));
}
.room::before{
  content:'';position:absolute;left:0;right:0;top:62%;height:1px;
  background:linear-gradient(90deg,transparent,var(--accent-color,var(--lilac-300)) 50%,transparent);
  opacity:.5;z-index:5;
}

/* O-window */
.O-window{
  position:absolute;left:58%;top:14%;width:42%;aspect-ratio:1;
  border:2px solid var(--accent-color,var(--bone-50));border-radius:50%;
  background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.18),transparent 60%),
    linear-gradient(180deg,var(--sky-top,#2a2335) 0%,var(--sky-bot,#181420) 70%,transparent 100%);
  z-index:2;
}
.O-window::after{
  content:'';position:absolute;left:12%;right:12%;bottom:18%;height:28%;
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.55)),
    repeating-linear-gradient(90deg,transparent 0 16px,rgba(0,0,0,.15) 16px 17px);
  opacity:.6;
}

/* furniture */
.furn{position:absolute;z-index:4;}
.furn svg{display:block;}

/* hotspots */
.hotspot{
  position:absolute;z-index:6;width:30px;height:30px;border-radius:50%;
  background:transparent;border:none;cursor:pointer;padding:0;
  display:flex;align-items:center;justify-content:center;
  transition:transform 200ms var(--ease-out);
}
.hotspot:hover{transform:scale(1.15) translate(-50%,-50%) !important;}
.hotspot .pulse{
  position:absolute;inset:0;border-radius:50%;background:rgba(251,247,240,.5);
  opacity:.3;animation:pulse 2.4s var(--ease-out) infinite;
}
@keyframes pulse{0%{transform:scale(.7);opacity:.5;}60%{transform:scale(1.6);opacity:0;}100%{transform:scale(1.6);opacity:0;}}
.hotspot .dot{
  width:12px;height:12px;border-radius:50%;background:var(--bone-50);
  box-shadow:0 0 0 4px rgba(240,234,224,.18);z-index:2;
}
.hotspot.dark .dot{background:var(--ink);box-shadow:0 0 0 4px rgba(24,20,32,.18);}
.hotspot.dark .pulse{background:var(--ink);}

/* scene label */
.scene-label{position:absolute;left:38px;top:36px;z-index:8;color:var(--bone-50);}
.scene-label .eyebrow{
  font-size:10px;letter-spacing:.22em;text-transform:uppercase;
  opacity:.6;margin-bottom:14px;color:var(--accent-color,var(--bone-50));
}
.scene-label h1{
  font-weight:200;font-size:clamp(40px,5vw,64px);
  letter-spacing:-0.03em;line-height:1.0;color:var(--bone-50);max-width:13ch;margin:0;
}
.scene-label h1 em{font-style:italic;font-weight:300;color:var(--accent-color,var(--lilac-300));letter-spacing:-0.025em;}
.scene-label p{margin-top:22px;max-width:30ch;font-size:14px;line-height:1.55;color:rgba(240,234,224,.78);}

/* bottom bar */
.bottombar{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px;
  padding:0 32px 18px;z-index:30;
}
.scene-now{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--bone-50);opacity:.7;font-family:var(--font-mono);}
.scene-now em{font-style:normal;color:var(--lilac-300);margin-right:12px;}
.dots{display:flex;gap:8px;justify-content:center;}
.dot-btn{
  width:8px;height:8px;border-radius:50%;background:transparent;
  border:1px solid var(--bone-50);opacity:.5;cursor:pointer;padding:0;
  transition:all 200ms var(--ease-out);
}
.dot-btn.active{background:var(--bone-50);opacity:1;transform:scale(1.4);}
.dot-btn:hover{opacity:.9;}
.nav-btn{display:flex;gap:12px;justify-content:flex-end;}
.nav-btn button{
  background:transparent;border:1px solid rgba(240,234,224,.3);color:var(--bone-50);
  padding:8px 18px;border-radius:var(--r-pill);cursor:pointer;
  font-family:var(--font-sans);font-size:13px;letter-spacing:.04em;
  transition:all 180ms var(--ease-out);
}
.nav-btn button:hover{background:var(--bone-50);color:var(--ink);border-color:var(--bone-50);}
.nav-btn button:disabled{opacity:.25;cursor:not-allowed;}
.nav-btn button.primary{background:var(--bone-50);color:var(--ink);border-color:var(--bone-50);}

/* detail panel */
.panel-mask{
  position:fixed;inset:0;z-index:50;
  background:rgba(14,11,22,.45);backdrop-filter:blur(4px);
  opacity:0;pointer-events:none;
}
.panel{
  position:fixed;top:0;right:0;bottom:0;width:440px;max-width:92vw;
  background:var(--bone-200);z-index:51;
  transform:translateX(100%);
  display:flex;flex-direction:column;overflow-y:auto;
}
.panel-close{
  position:absolute;top:16px;right:16px;width:32px;height:32px;
  border:1px solid var(--line);border-radius:50%;background:transparent;
  cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink);
}
.panel-photo{
  height:320px;position:relative;background:var(--lilac-200);
  display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;
}
.panel-photo svg{max-width:60%;max-height:60%;}
.panel-body{padding:28px 32px 32px;color:var(--ink);}
.panel-body .kicker{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--fg-muted);margin-bottom:10px;}
.panel-body h3{font-weight:300;font-size:30px;letter-spacing:-0.02em;margin:0 0 6px;}
.panel-body .design{font-style:italic;font-weight:300;font-size:16px;color:var(--lilac-500);letter-spacing:-0.01em;margin-bottom:22px;}
.panel-body .blurb{font-size:14px;line-height:1.6;color:var(--ink-700);margin-bottom:24px;}
.panel-body .meta-row{
  display:grid;grid-template-columns:1fr 1fr;gap:16px;
  padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:22px;
}
.panel-body .meta-row .k{font-family:var(--font-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg-muted);margin-bottom:4px;}
.panel-body .meta-row .v{font-size:14px;font-weight:500;color:var(--ink);}
.panel-actions{display:flex;flex-direction:column;gap:10px;}
.btn-pri,.btn-sec{
  font-family:var(--font-sans);font-size:14px;font-weight:500;
  padding:13px 22px;border-radius:var(--r-pill);border:0;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:space-between;
  transition:all 180ms var(--ease-out);
}
.btn-pri{background:var(--ink);color:var(--bone-50);}
.btn-pri:hover{background:var(--lilac-500);}
.btn-sec{background:transparent;color:var(--ink);border:1px solid var(--ink);}
.btn-sec:hover{background:var(--ink);color:var(--bone-50);}
.arr{display:inline-block;transition:transform 200ms var(--ease-out);}
.btn-pri:hover .arr,.btn-sec:hover .arr{transform:translateX(4px);}

/* opening */
.scene.opening{background:var(--ink-900);}
.opening-mark{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  text-align:center;z-index:2;
}
.O-big{
  width:260px;height:260px;border:2px solid rgba(240,234,224,.25);border-radius:50%;
  margin:0 auto 28px;animation:breathe 6s var(--ease-out) infinite;
}
@keyframes breathe{0%,100%{transform:scale(1);}50%{transform:scale(1.025);}}
.opening-wm{font-weight:500;font-size:48px;letter-spacing:-0.03em;color:var(--bone-50);display:flex;align-items:baseline;justify-content:center;gap:8px;}
.opening-wm .the{font-size:20px;font-weight:200;opacity:.7;}
.opening-sub{margin-top:20px;font-size:13px;color:rgba(240,234,224,.55);letter-spacing:.18em;text-transform:uppercase;}
.opening-hint{margin-top:48px;font-size:11px;font-family:var(--font-mono);letter-spacing:.2em;color:rgba(155,127,166,.65);text-transform:uppercase;}

/* moodboard rail */
.moodboard-rail{position:absolute;left:38px;bottom:32px;z-index:8;display:flex;align-items:center;gap:16px;color:var(--bone-50);}
.moodboard-rail .count{font-family:var(--font-mono);font-size:11px;letter-spacing:.16em;opacity:.6;}
.moodboard-rail .hint{font-size:12px;opacity:.65;letter-spacing:.04em;}

/* begin scene */
.begin-content{
  position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;gap:64px;
  padding:56px;color:var(--bone-50);z-index:5;
}
.begin-content h1{font-weight:200;font-size:clamp(48px,6vw,84px);letter-spacing:-0.03em;line-height:1.0;color:var(--bone-50);margin:0;}
.begin-content h1 em{font-style:italic;font-weight:300;color:rgba(240,234,224,.7);}
.begin-content .lede{margin-top:24px;font-size:15px;line-height:1.65;max-width:36ch;color:rgba(240,234,224,.85);}
.begin-form{display:flex;flex-direction:column;gap:16px;align-self:center;}
.begin-form>div{display:flex;flex-direction:column;gap:5px;}
.begin-form label{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(240,234,224,.6);}
.begin-form input,.begin-form textarea,.begin-form select{
  font-family:var(--font-sans);font-size:15px;color:var(--bone-50);
  background:transparent;border:0;border-bottom:1px solid rgba(240,234,224,.35);
  padding:10px 0;outline:none;width:100%;
}
.begin-form input:focus,.begin-form textarea:focus,.begin-form select:focus{border-color:var(--bone-50);}
.begin-form input::placeholder,.begin-form textarea::placeholder{color:rgba(240,234,224,.4);}
.begin-form select{appearance:none;-webkit-appearance:none;cursor:pointer;}
.begin-form select option{background:#3a2e45;color:#fff;}
.begin-form .submit{
  margin-top:8px;background:var(--bone-200);color:var(--lilac-700);
  border-radius:var(--r-pill);padding:14px 22px;font-weight:500;
  cursor:pointer;border:0;display:inline-flex;justify-content:space-between;align-items:center;
  font-family:var(--font-sans);font-size:14px;transition:all 180ms var(--ease-out);
}
.begin-form .submit:hover{background:var(--bone-50);}

/* vignette */
.vignette{position:fixed;inset:0;z-index:20;pointer-events:none;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(14,11,22,.55) 100%);}

/* responsive */
@media(max-width:880px){
  .scene-label{left:22px;top:22px;right:22px;}
  .scene-label h1{font-size:clamp(32px,9vw,52px);}
  .begin-content{grid-template-columns:1fr;padding:32px;gap:32px;}
  .O-window{left:35%;top:26%;width:60%;}
  .scene-area{margin:0 16px;}
  .topbar{padding:0 16px;}
  .bottombar{padding:0 16px 18px;}
  .topbar-nav{gap:16px;}
}
@media(max-width:580px){
  .topbar-nav{display:none;}
  .brand .sep,.brand .sub{display:none;}
}
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>

<div id="cursor"></div>
<div class="vignette"></div>
<div id="app"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

// ── Furniture SVG components ─────────────────────────────────────

const Sofa = ({ color = '#C49A7A', leg = '#181420' }) => (
  <svg viewBox="0 0 240 110" width="100%" height="100%">
    <rect x="14" y="14" width="212" height="50" rx="10" fill={color} />
    <rect x="20" y="48" width="100" height="38" rx="8" fill={color} opacity="0.85" />
    <rect x="120" y="48" width="100" height="38" rx="8" fill={color} opacity="0.85" />
    <rect x="0" y="36" width="22" height="56" rx="8" fill={color} opacity="0.9" />
    <rect x="218" y="36" width="22" height="56" rx="8" fill={color} opacity="0.9" />
    <rect x="14" y="88" width="6" height="14" fill={leg} />
    <rect x="220" y="88" width="6" height="14" fill={leg} />
    <circle cx="44" cy="58" r="13" fill="#F0EAE0" opacity="0.55" />
  </svg>
);

const ArcLamp = ({ color = '#F0EAE0', pole = '#181420' }) => (
  <svg viewBox="0 0 120 220" width="100%" height="100%">
    <ellipse cx="100" cy="208" rx="18" ry="4" fill={pole} />
    <path d="M100 208 L100 140 Q100 30 30 30" stroke={pole} strokeWidth="3" fill="none" strokeLinecap="round"/>
    <ellipse cx="30" cy="36" rx="20" ry="10" fill={color} />
    <rect x="10" y="36" width="40" height="22" fill={color} />
    <ellipse cx="30" cy="58" rx="20" ry="10" fill={color} opacity="0.7" />
  </svg>
);

const CoffeeTable = ({ color = '#181420', top = '#C49A7A' }) => (
  <svg viewBox="0 0 200 70" width="100%" height="100%">
    <ellipse cx="100" cy="20" rx="92" ry="14" fill={top} />
    <ellipse cx="100" cy="20" rx="92" ry="14" fill="none" stroke={color} strokeWidth="1.5" />
    <rect x="20" y="22" width="3" height="40" fill={color} />
    <rect x="178" y="22" width="3" height="40" fill={color} />
    <ellipse cx="100" cy="64" rx="80" ry="5" fill={color} opacity="0.18" />
  </svg>
);

const Vase = ({ color = '#9B7FA6', stem = '#6B7A5C' }) => (
  <svg viewBox="0 0 80 180" width="100%" height="100%">
    <path d="M40 80 Q30 50 20 28" stroke={stem} strokeWidth="1.5" fill="none" strokeLinecap="round" />
    <path d="M40 80 Q50 45 56 18" stroke={stem} strokeWidth="1.5" fill="none" strokeLinecap="round" />
    <path d="M40 80 Q42 60 44 38" stroke={stem} strokeWidth="1.5" fill="none" strokeLinecap="round" />
    <ellipse cx="20" cy="26" rx="3.5" ry="6" fill={stem} />
    <ellipse cx="56" cy="16" rx="3.5" ry="6" fill={stem} />
    <ellipse cx="44" cy="36" rx="3" ry="5" fill={stem} />
    <path d="M22 84 Q14 110 22 150 L58 150 Q66 110 58 84 Z" fill={color} />
    <ellipse cx="40" cy="84" rx="18" ry="5" fill={color} opacity="0.85" />
  </svg>
);

const Artwork = ({ frame = '#181420', tint1 = '#9B7FA6', tint2 = '#C49A7A' }) => (
  <svg viewBox="0 0 180 120" width="100%" height="100%">
    <rect x="2" y="2" width="176" height="116" fill="#F0EAE0" stroke={frame} strokeWidth="2" />
    <circle cx="60" cy="62" r="34" fill={tint1} opacity="0.85" />
    <circle cx="110" cy="48" r="22" fill={tint2} opacity="0.9" />
    <path d="M20 96 L160 96" stroke={frame} strokeWidth="1.2" opacity="0.4" />
  </svg>
);

const Bed = ({ frame = '#181420', cloth = '#F0EAE0', pillow = '#CDBBD4' }) => (
  <svg viewBox="0 0 360 140" width="100%" height="100%">
    <rect x="0" y="0" width="360" height="34" rx="6" fill={frame} />
    <rect x="14" y="34" width="332" height="50" rx="6" fill={cloth} />
    <rect x="32" y="44" width="80" height="22" rx="6" fill={pillow} />
    <rect x="120" y="44" width="80" height="22" rx="6" fill={pillow} opacity="0.85" />
    <rect x="14" y="80" width="332" height="14" rx="4" fill={cloth} opacity="0.7" />
    <rect x="0" y="94" width="360" height="22" rx="4" fill={frame} opacity="0.85" />
    <rect x="4" y="116" width="6" height="20" fill={frame} />
    <rect x="350" y="116" width="6" height="20" fill={frame} />
  </svg>
);

const Rug = ({ color = '#9B7FA6' }) => (
  <svg viewBox="0 0 420 80" width="100%" height="100%">
    <ellipse cx="210" cy="40" rx="208" ry="34" fill={color} opacity="0.55" />
    <ellipse cx="210" cy="40" rx="180" ry="28" fill="none" stroke={color} strokeWidth="1.2" opacity="0.6" />
  </svg>
);

const Pendant = ({ color = '#C49A7A', cord = '#181420' }) => (
  <svg viewBox="0 0 120 180" width="100%" height="100%">
    <line x1="60" y1="0" x2="60" y2="80" stroke={cord} strokeWidth="1.5" />
    <path d="M30 80 L90 80 L82 130 L38 130 Z" fill={color} />
    <ellipse cx="60" cy="132" rx="22" ry="5" fill={color} opacity="0.5" />
    <ellipse cx="60" cy="160" rx="50" ry="14" fill={color} opacity="0.18" />
  </svg>
);

const Counter = ({ color = '#181420', top = '#C49A7A' }) => (
  <svg viewBox="0 0 420 140" width="100%" height="100%">
    <rect x="0" y="0" width="420" height="14" rx="3" fill={top} />
    <rect x="0" y="14" width="420" height="106" fill={color} />
    <line x1="140" y1="14" x2="140" y2="120" stroke="rgba(240,234,224,.18)" strokeWidth="1" />
    <line x1="280" y1="14" x2="280" y2="120" stroke="rgba(240,234,224,.18)" strokeWidth="1" />
    <rect x="60" y="60" width="30" height="3" rx="1" fill="#C49A7A" />
    <rect x="200" y="60" width="30" height="3" rx="1" fill="#C49A7A" />
    <rect x="340" y="60" width="30" height="3" rx="1" fill="#C49A7A" />
    <rect x="0" y="120" width="420" height="20" fill="rgba(0,0,0,.25)" />
  </svg>
);

function BottomBar({ idx, total, setIdx, scene }) {

        {scene.mood}

      <div className="dots">
        {Array.from({ length: total }).map((_,i) => (
          <button key={i} className={"dot-btn"+(i===idx?" active":"")} onClick={()=>setIdx(i)} aria-label={"scene "+i} />
        ))}
      </div>
      <div className="nav-btn">
        <button onClick={()=>setIdx(Math.max(0,idx-1))} disabled={idx===0}>← prev</button>
        <button className={isLast?"primary":""} onClick={()=>setIdx(Math.min(total-1,idx+1))}>

      </div>
    </div>

function DetailPanel({ item, onClose }) {
  const maskRef = useRef(null);
  const panelRef = useRef(null);
  const [content, setContent] = useState(null);
  const open = !!item;

  useEffect(() => { if (item) setContent(item); }, [item]);

  useEffect(() => {
    const mask = maskRef.current, panel = panelRef.current;
    if (!mask || !panel) return;
    mask.getAnimations().forEach(a => a.cancel());
    panel.getAnimations().forEach(a => a.cancel());
    if (open) {
      mask.style.pointerEvents = 'auto';
      mask.animate([{ opacity:0 },{ opacity:1 }], { duration:280, easing:'cubic-bezier(0.22,1,0.36,1)', fill:'forwards' });
      panel.animate([{ transform:'translateX(100%)' },{ transform:'translateX(0)' }], { duration:420, easing:'cubic-bezier(0.22,1,0.36,1)', fill:'forwards' });
    } else {
      mask.style.pointerEvents = 'none';
      mask.animate([{ opacity:1 },{ opacity:0 }], { duration:240, easing:'cubic-bezier(0.22,1,0.36,1)', fill:'forwards' });
      panel.animate([{ transform:'translateX(0)' },{ transform:'translateX(100%)' }], { duration:320, easing:'cubic-bezier(0.22,1,0.36,1)', fill:'forwards' });
      const t = setTimeout(() => setContent(null), 350);
      return () => clearTimeout(t);
    }
  }, [open]);

  if (!content) return null;
  const C = FURN[content.Comp];
  return (
    <div ref={maskRef} className="panel-mask" style={{ opacity:0, pointerEvents:'none' }} onClick={onClose}>
      <div ref={panelRef} className="panel" style={{ transform:'translateX(100%)' }} onClick={e => e.stopPropagation()}>
        <button className="panel-close" onClick={onClose} aria-label="close">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5">
            <path d="M18 6 6 18M6 6l12 12" />
          </svg>
        </button>
        <div className="panel-photo" style={{ background: panelBg(content.Comp) }}>
          {C && <C {...content.props} />}
        </div>
        <div className="panel-body">
          <div className="kicker">{content.info.kicker}</div>
          <h3>{content.info.name}</h3>
          <div className="design">{content.info.design}</div>
          {content.info.blurb && <p className="blurb">{content.info.blurb}</p>}
          <div className="meta-row">
            {content.info.meta.map(([k,v],i) => (
              <div key={i}><div className="k">{k}</div><div className="v">{v}</div></div>
            ))}
          </div>
          <div className="panel-actions">
            <button className="btn-pri">Save to moodboard <span className="arr">→</span></button>
            <button className="btn-sec">We'll source for you <span className="arr">→</span></button>
          </div>
        </div>
      </div>
    </div>
  );
}

function SceneSlot({ scene, isActive, isBehind, children }) {
  const ref = useRef(null);

  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const targetOp = isActive ? 1 : 0;
    const targetScale = isActive ? 1 : (isBehind ? 0.96 : 1.04);
    const targetBlur = isActive ? 0 : 8;
    el.getAnimations().forEach(a => a.cancel());
    const cs = getComputedStyle(el);
    const curOp = parseFloat(cs.opacity) || 0;
    el.animate(
      [
        { opacity: curOp, transform: cs.transform === 'none' ? `scale(1)` : cs.transform, filter: cs.filter === 'none' ? 'blur(0px)' : cs.filter },
        { opacity: targetOp, transform: `scale(${targetScale})`, filter: `blur(${targetBlur}px)` },
      ],
      { duration: 900, easing: 'cubic-bezier(0.22,1,0.36,1)', fill: 'forwards' }
    );
  }, [isActive, isBehind]);

  const extraClass = scene.kind === 'opening' ? ' opening' : '';
  return (
    <div
      ref={ref}
      className={"scene" + extraClass}
      style={{
        ...(scene.palette || {}),
        opacity: isActive ? 1 : 0,
        transform: isActive ? 'scale(1)' : (isBehind ? 'scale(0.96)' : 'scale(1.04)'),
        filter: isActive ? 'blur(0px)' : 'blur(8px)',
        pointerEvents: isActive ? 'auto' : 'none',
        position: 'absolute', inset: 0,
      }}
    >
      {children}
    </div>
  );
}

function Stage() {
  const [idx, setIdx] = useState(0);
  const [hot, setHot] = useState(null);

  useEffect(() => {
    const onKey = (e) => {
      if (hot) { if (e.key === 'Escape') setHot(null); return; }
      if (e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' ') { e.preventDefault(); setIdx(i=>Math.min(SCENES.length-1,i+1)); }
      if (e.key==='ArrowLeft'||e.key==='ArrowUp') { setIdx(i=>Math.max(0,i-1)); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [hot]);

  useEffect(() => {
    if (idx !== 0) return;
    const onClick = (e) => {
      if (e.target.closest('.topbar')||e.target.closest('.bottombar')) return;
      setIdx(1);
    };
    window.addEventListener('click', onClick);
    return () => window.removeEventListener('click', onClick);
  }, [idx]);

  const scene = SCENES[idx];

  return (
    <div className="stage">
      <TopBar onJump={setIdx} />
      <div className="scene-area">
        {SCENES.map((s, i) => (
          <SceneSlot key={s.id} scene={s} isActive={i===idx} isBehind={i<idx}>
            {s.kind==='opening' && <OpeningScene />}
            {s.kind==='room'    && <RoomScene scene={s} onHotspot={setHot} />}
            {s.kind==='begin'   && <BeginScene />}
          </SceneSlot>
        ))}
      </div>
      <BottomBar idx={idx} total={SCENES.length} setIdx={setIdx} scene={scene} />
      <DetailPanel item={hot} onClose={()=>setHot(null)} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<Stage />);

<script>
(function() {
  const cursor = document.getElementById('cursor');
  let mx = -100, my = -100, cx = -100, cy = -100;
  document.addEventListener('mousemove', (e) => { mx = e.clientX; my = e.clientY; });
  document.addEventListener('mousedown', () => cursor.classList.add('pressed'));
  document.addEventListener('mouseup', () => cursor.classList.remove('pressed'));
  document.addEventListener('mouseleave', () => { mx = -200; my = -200; });
  function lerp(a,b,t){ return a+(b-a)*t; }
  function tick(){
    cx=lerp(cx,mx,.18); cy=lerp(cy,my,.18);
    cursor.style.left=cx+'px'; cursor.style.top=cy+'px';
    requestAnimationFrame(tick);
  }
  tick();
})();
</script>
